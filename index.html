<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>CinéPaff</title>
  </head>
  <body>
    <div id="app" class="spa-shell">
      <header class="topbar">
        <a class="brand" href="#/">CinéPaff</a>
        <nav id="main-nav" class="nav hidden" aria-label="Navigation">
          <a href="#/proposer" data-route="proposer">Proposer</a>
          <a href="#/tirage" data-route="tirage">Tirage</a>
          <a href="#/admins" data-route="admins" data-admin-only>Admins</a>
        </nav>
        <div class="session">
          <span id="current-user"></span>
          <button id="logout" class="btn ghost hidden" type="button">Déconnexion</button>
        </div>
      </header>

      <main>
        <section id="login-view" class="view auth-view">
          <form id="login-form" class="card form-card">
            <h1>Connexion</h1>
            <label>
              ID
              <input id="login-id" name="id" type="text" required autocomplete="username" />
            </label>
            <label>
              MDP
              <input id="login-password" name="password" type="password" required autocomplete="current-password" />
            </label>
            <button class="btn primary" type="submit">Connexion</button>
            <p id="login-message" class="message" role="status"></p>
          </form>
        </section>

        <section id="app-view" class="view hidden">
          <section id="proposer-view" class="route-view grid-view">
            <form id="tmdb-config-form" class="card form-card">
              <h2>TMDB</h2>
              <label>
                Jeton API
                <input id="tmdb-token" type="password" autocomplete="off" />
              </label>
              <button class="btn" type="submit">Enregistrer</button>
              <p id="tmdb-message" class="message" role="status"></p>
            </form>

            <form id="proposal-form" class="card form-card wide">
              <h1>Proposer 2 films</h1>
              <div class="movie-picker">
                <label>
                  Film 1
                  <input id="movie-search-1" type="search" autocomplete="off" required />
                </label>
                <ul id="movie-results-1" class="results"></ul>
                <div id="movie-selected-1" class="selected-movie"></div>
              </div>
              <div class="movie-picker">
                <label>
                  Film 2
                  <input id="movie-search-2" type="search" autocomplete="off" required />
                </label>
                <ul id="movie-results-2" class="results"></ul>
                <div id="movie-selected-2" class="selected-movie"></div>
              </div>
              <button class="btn primary" type="submit">Proposer</button>
              <p id="proposal-message" class="message" role="status"></p>
            </form>

            <article class="card wide">
              <h2>Films proposés</h2>
              <ul id="proposal-list" class="movie-list"></ul>
            </article>
          </section>

          <section id="tirage-view" class="route-view hidden">
            <article class="card draw-card">
              <h1>Tirage</h1>
              <button id="draw-button" class="btn primary admin-action" type="button">Lancer le tirage</button>
              <div id="draw-result" class="draw-result"></div>
              <p id="draw-message" class="message" role="status"></p>
            </article>
          </section>

          <section id="admins-view" class="route-view hidden grid-view">
            <form id="admin-form" class="card form-card">
              <h1>Admins</h1>
              <label>
                ID
                <input id="new-admin-id" type="text" required autocomplete="off" />
              </label>
              <label>
                MDP
                <input id="new-admin-password" type="password" required autocomplete="new-password" />
              </label>
              <button class="btn primary" type="submit">Ajouter</button>
              <p id="admin-message" class="message" role="status"></p>
            </form>
            <article class="card">
              <h2>Admins</h2>
              <ul id="admin-list" class="simple-list"></ul>
            </article>
          </section>
        </section>
      </main>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
