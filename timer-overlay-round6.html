<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="timer-overlay-round6.css" />
    <title>ZogQuiz Timer Overlay - Manche 6</title>
  </head>
  <body class="timer-overlay-page">
    <main class="timer-overlay-root timer-overlay-round6" aria-live="polite">
      <section id="m6-timer-participant-shell" class="m6-segmented-timer m6-timer-participant" aria-label="Timer joueur 1">
        <svg class="m6-timer-segments-svg" viewBox="0 0 100 100" aria-hidden="true" focusable="false"><g id="m6-timer-participant-segments"></g></svg>
        <p id="m6-timer-participant" class="m6-timer-overlay-value">1:00</p>
      </section>
      <section id="m6-timer-viewer-shell" class="m6-segmented-timer m6-timer-viewer" aria-label="Timer joueur 2">
        <svg class="m6-timer-segments-svg" viewBox="0 0 100 100" aria-hidden="true" focusable="false"><g id="m6-timer-viewer-segments"></g></svg>
        <p id="m6-timer-viewer" class="m6-timer-overlay-value">1:00</p>
      </section>
    </main>
    <script type="module" src="js/timer-overlay-round6.js"></script>
  </body>
</html>
