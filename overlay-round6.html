<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="overlay-round6.css" />
    <title>Overlay Manche 6</title>
  </head>
  <body>
    <main class="m6-overlay">
      <p class="eyebrow">Manche 6</p>
      <h1>Duel final</h1>
      <section class="m6-duel-grid">
        <article id="m6-card-participant" class="m6-player-card">
          <p class="eyebrow">Joueur 1</p>
          <h2 id="m6-player-participant">Participant<small>survivant M5</small></h2>
          <strong id="m6-timer-participant" class="m6-timer">1:00</strong>
          <p>Réponse : <span id="m6-answer-participant">—</span></p>
        </article>
        <article id="m6-card-viewer" class="m6-player-card">
          <p class="eyebrow">Joueur 2</p>
          <h2 id="m6-player-viewer">Viewer<small>top viewer</small></h2>
          <strong id="m6-timer-viewer" class="m6-timer">1:00</strong>
          <p>Réponse : <span id="m6-answer-viewer">—</span></p>
        </article>
      </section>
      <section class="m6-question-card">
        <div class="m6-live-meta">
          <p>Phase : <strong id="m6-phase">Préparation</strong></p>
          <p>État : <strong id="m6-status">En attente</strong></p>
        </div>
        <p id="m6-question" class="m6-question-text">Question en attente côté admin.</p>
        <p id="m6-winner" class="m6-winner">Premier chrono à zéro perd la finale.</p>
      </section>
    </main>
    <script type="module" src="js/overlay-round6.js"></script>
  </body>
</html>
