<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="overlay-round5.css" />
    <title>ZogQuiz Overlay - Manche 5</title>
  </head>
  <body class="overlay-page">
    <main class="m5o" aria-live="polite">
      <section class="m5o-hud" aria-label="PV des participants du duel">
        <article id="m5o-left-fighter" class="m5o-fighter m5o-fighter-left" data-side="left">
          <div class="m5o-fighter-meta">
            <span id="m5o-left-name" class="m5o-fighter-name">—</span>
            <strong id="m5o-left-hp" class="m5o-fighter-hp">0 PV</strong>
          </div>
          <div class="m5o-health-frame" aria-hidden="true">
            <div id="m5o-left-bar" class="m5o-health-bar"></div>
          </div>
        </article>
        <div class="m5o-versus" aria-hidden="true">VS</div>
        <article id="m5o-right-fighter" class="m5o-fighter m5o-fighter-right" data-side="right">
          <div class="m5o-fighter-meta">
            <span id="m5o-right-name" class="m5o-fighter-name">—</span>
            <strong id="m5o-right-hp" class="m5o-fighter-hp">0 PV</strong>
          </div>
          <div class="m5o-health-frame" aria-hidden="true">
            <div id="m5o-right-bar" class="m5o-health-bar"></div>
          </div>
        </article>
      </section>
    </main>
    <script type="module" src="js/overlay-round5.js"></script>
  </body>
</html>
