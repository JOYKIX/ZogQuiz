<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Intro Manche 1 · Le Sprint de Takumi · ZogQuiz</title>
  <link rel="stylesheet" href="css/intro.css" />
</head>
<body class="intro-page" data-round="round1">
  <main class="intro-app is-idle" data-intro-app>
    <div class="intro-background" aria-hidden="true">
      <span class="intro-orb one"></span>
      <span class="intro-orb two"></span>
      <span class="intro-shape"></span>
    </div>

    <div class="intro-shell">
      <header class="intro-topbar">
        <div class="intro-brand">
          <img class="intro-logo" src="image/logo.png" alt="ZogQuiz" />
          <div>
            <p class="intro-kicker">Intro animée</p>
            <p class="intro-round-label" data-intro-round-label>Manche 1</p>
          </div>
        </div>

        <nav class="intro-controls" aria-label="Contrôles de l'introduction">
          <button class="intro-button primary" type="button" data-intro-start-button>Lancer l'intro</button>
          <button class="intro-button" type="button" data-intro-skip-button>Passer</button>
          <button class="intro-button ghost" type="button" data-intro-replay-button>Rejouer</button>
          <button class="intro-button accent" type="button" data-intro-voice-toggle aria-pressed="true">Voix : ON</button>
        </nav>
      </header>

      <section class="intro-stage" data-intro-stage aria-live="polite">
        <div class="intro-hero">
          <p class="intro-eyebrow">Présentation de manche</p>
          <h1 class="intro-title" data-intro-title>Manche 1</h1>
          <p class="intro-subtitle" data-intro-subtitle></p>
          <article class="intro-concept-card">
            <p data-intro-concept></p>
          </article>
        </div>

        <aside class="intro-visual-card" aria-label="Animation visuelle de la manche">
          <div class="intro-visual-title" data-intro-visual-title>Manche 1</div>
          <div class="intro-scene-visual" data-intro-scene-visual></div>
        </aside>
      </section>

      <footer class="intro-footer">
        <div class="intro-subtitle-box" data-intro-subtitle-box role="status" aria-live="polite"></div>
        <div class="intro-progress" aria-label="Progression de l'introduction">
          <div class="intro-progress-bar" data-intro-progress-bar></div>
        </div>
        <div class="intro-status" data-intro-status>Prêt.</div>
      </footer>
    </div>

    <section class="intro-start-overlay" data-intro-start-overlay aria-label="Démarrage de l'introduction">
      <article class="intro-start-card intro-final-card">
        <h2 data-intro-start-title>Le Sprint de Takumi</h2>
        <p data-intro-start-text>Cliquez pour lancer l'animation.</p>
        <p class="intro-support-warning" data-intro-support-warning hidden></p>
        <div class="intro-start-actions">
          <button class="intro-button primary" type="button" data-intro-start-button>Lancer l'intro</button>
          <button class="intro-button accent" type="button" data-intro-voice-toggle aria-pressed="true">Voix : ON</button>
        </div>
      </article>
    </section>

    <section class="intro-final-overlay" data-intro-final-overlay hidden aria-label="Fin de l'introduction">
      <article class="intro-final-card">
        <h2 data-intro-final-title>La manche peut commencer</h2>
        <p data-intro-final-text>Prêts ?</p>
        <div class="intro-final-actions">
          <button class="intro-button primary" type="button" data-intro-final-replay-button>Rejouer</button>
          <button class="intro-button" type="button" data-intro-return-button data-href="index.html">Retour</button>
        </div>
      </article>
    </section>
  </main>

  <script src="js/intro-rounds.js"></script>
  <script src="js/intro-engine.js"></script>
</body>
</html>
